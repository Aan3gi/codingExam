<!DOCTYPE html>
<html>
<head>
    <title>Amortization Calculator</title>
</head>
<body>

    <p>Name: Ashika</p>
    <p>Email: anegi@my.waketech.edu</p>
    <p>Date: October 16, 2026</p>

    <h1>Amortization Calculator</h1>

    <button id="Button1">Calculate Mortgage</button>

    <div id="results"></div>

    <script>
        document.getElementById("Button1").addEventListener("click", function() {

            var loanAmount = Number(prompt("Enter the loan amount without commas:"));
            var termYears = Number(prompt("Enter the loan term in years (15 or 30):"));

            if (termYears != 15 && termYears != 30) {
                alert("Loan term must be 15 or 30 years.");
                return;
            }

            if (loanAmount <= 0 || isNaN(loanAmount)) {
                alert("Please enter a valid loan amount.");
                return;
            }

            var interestRate = 0.0575;
            var termMonths = termYears * 12;

            var monthlyPayment = (((interestRate / 12) * loanAmount) /
                (1 - Math.pow(1 + (interestRate / 12), termYears * -12))).toFixed(2);

            var totalInterest = (monthlyPayment * termMonths) - loanAmount;
            var totalLoan = loanAmount + totalInterest;
            var balance = totalLoan;

            var output = "";

            output += "<h2>Mortgage Information</h2>";
            output += "<p>Mortgage Term: " + termYears + " years</p>";
            output += "<p>Interest Rate: 5.75%</p>";
            output += "<p>Loan Amount: $" + loanAmount.toFixed(2) + "</p>";
            output += "<p>Monthly Payment: $" + monthlyPayment + "</p>";
            output += "<p>Total Interest: $" + totalInterest.toFixed(2) + "</p>";
            output += "<p>Total Mortgage Amount: $" + totalLoan.toFixed(2) + "</p>";

            output += "<h2>Amortization Schedule</h2>";

            output += "<table border='1'>";
            output += "<tr><th>Month</th><th>Monthly Payment</th><th>Loan Balance</th></tr>";

            for (var month = 1; month <= termMonths; month++) {

                balance = balance - monthlyPayment;

                if (balance <= 0 || month == termMonths) {
                    balance = 0;
                }

                output += "<tr>";
                output += "<td>" + month + "</td>";
                output += "<td>$" + monthlyPayment + "</td>";
                output += "<td>$" + balance.toFixed(2) + "</td>";
                output += "</tr>";

                if (balance == 0) {
                    output += "</table>";
                    output += "<p>This is the Ending Amortization Calculator...</p>";
                    break;
                }
            }

            document.getElementById("results").innerHTML = output;

        });
    </script>

</body>
</html>
